services:
  site:
    image: nginxinc/nginx-unprivileged:stable-alpine
    container_name: peledev-site
    restart: unless-stopped
    ports:
      - "127.0.0.1:3016:8080"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m
      - /var/cache/nginx:size=8m
      - /var/run:size=1m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    networks:
      isolated:
        ipv4_address: 10.99.250.2

networks:
  # Eigenes Bridge-Netz mit fester IP. Egress wird per iptables DOCKER-USER
  # geblockt (scripts/egress-lock.sh) — ein kompromittierter nginx kommt so
  # weder ins LAN noch ins Internet. Inbound via published port bleibt.
  isolated:
    driver: bridge
    ipam:
      config:
        - subnet: 10.99.250.0/24
